[package]
name = "pedigree-graph-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host-neutral pedigree relationship engine (ADR 0007)"

[lints]
workspace = true

[lib]
name = "pedigree_graph_core"

[[bin]]
name = "pgr-count"
path = "src/bin/pgr_count.rs"

[[bin]]
name = "pgr-bench-pairs"
path = "src/bin/pgr_bench_pairs.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1.10"

[dev-dependencies]
# No default features: the property tests need no regex strategies, forking
# or timeouts, and the defaults would add a dozen crates to Cargo.lock.
# `~1.11`: 1.11.0 is the newest release that declares rust-version 1.85, the
# workspace floor (1.12.0 declares 1.88).
proptest = { version = "~1.11", default-features = false, features = ["std"] }
