[workspace]
resolver = "2"
members = ["crates/core", "crates/python"]

[workspace.package]
version = "0.13.0"
edition = "2021"
# The floor pixi.toml and the R binding crate already state; clippy reads it,
# so it never suggests an API newer than R users' rustc.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rwaples/pedigree-graph"

# No user-reachable panics (ADR 0007): input errors are error values the
# hosts raise, never panics.  A surviving `expect` / `unreachable!` names the
# internal invariant it relies on in an `#[expect(..., reason)]`.  `assert!`
# stays allowed: it states an invariant the caller already checked, and a
# failure is a bug the bindings surface as an exception rather than an abort.
# Test code is exempt through clippy.toml.  r/src/rust/Cargo.toml repeats
# this table (it is its own workspace); tests/test_r_version_agreement.py
# fails when the two differ.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
debug = 1
# One codegen unit, so adding a module cannot repartition the crate and move
# an unrelated kernel's inlining: under the default 16 the slice 15 modules
# made the unchanged generation-summary DP 12% slower on wf_n5000_g8 (9.41 s
# to 10.51 s); with one unit it is 8.76 s (gate/15a/NOTES.md).
codegen-units = 1
