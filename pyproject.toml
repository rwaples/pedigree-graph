[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pedigree-graph"
dynamic = ["version"]
description = "Sparse-matrix pedigree relationship extraction and kinship computation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Waples" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.14,<2",
    "numba>=0.60,<1",
]

[project.urls]
Homepage = "https://github.com/rwaples/pedigree-graph"
Repository = "https://github.com/rwaples/pedigree-graph"
Changelog = "https://github.com/rwaples/pedigree-graph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
    "hypothesis>=6,<7",
    "pandas>=3.0,<4",
    "polars>=1.43.2,<2",
    "pyarrow>=17,<26",
]
typecheck = ["ty==0.0.70"]

[tool.setuptools.packages.find]
include = ["pedigree_graph*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py313"
required-version = ">=0.16,<0.17"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "A", "C4", "PT", "PIE", "PERF", "TC", "PLW", "RSE", "RET", "D"]
ignore = [
    "E501",   # line too long — formatter handles wrapping
    "SIM108", # use ternary — often less readable
    "RUF002", # ambiguous unicode in docstring — scientific notation (×)
    "RUF003", # ambiguous unicode in comment — scientific notation (×)
    "D105",   # undocumented magic method — not needed
    "D107",   # undocumented __init__ — args documented in class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011", "RUF012", "D"]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pedigree_graph"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["pedigree_graph"]
exclude = ["tests"]

[tool.ty.terminal]
error-on-warning = false
