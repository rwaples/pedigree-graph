# pedigree-graph development environment (simACE family ADR 0018): a
# self-contained locked env installing this repo editable with its test +
# typecheck extras. ty resolves the package as first-party source here, so no
# compat-mode editable tricks are needed. Consumers install the PyPI wheel.
[workspace]
name = "pedigree-graph"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = "3.13.*"
pip = "*"
rust = ">=1.85"
maturin = ">=1.15.0,<2"

[pypi-dependencies]
pedigree-graph = { path = ".", editable = true, extras = ["test", "typecheck"] }

[tasks]
# -n 6 --dist worksteal: 703.3 s serial -> 333.7 s, 2.11x, which is 95% of the
# 2.21x ceiling set by a single 324.5 s test. Fewer workers do *worse* than
# their packing floor because xdist dispatches in collection order and that
# test is collected late, so it starts late and everything waits behind it;
# four workers land at 451.6 s. No thread pins: the package already defaults to
# a one-thread budget (_threads.py) and no parallel=True kernel survives, so an
# unpinned arm measured identically. See benchmarks/bench_pytest_workers.md.
# Bare `pixi run pytest` stays serial and unpinned, which is what -v, -s and
# --pdb need since xdist captures output and breaks the debugger.
test = "pytest -n 6 --dist worksteal"

# The R package under r/ (slice 16, plans/pedigree-graph-slice-16-r-package.md
# in simACE). Its own environment so the default one never pulls in R; it
# reuses the Rust pin above. `r-install` builds r/ in place into the env's
# library; `r-test` runs its testthat suite against that install.
[feature.r.dependencies]
r-base = "4.5.*"
r-testthat = ">=3.2"
r-matrix = "*"
r-roxygen2 = "*"
c-compiler = "*"
make = "*"

[feature.r.tasks]
r-install = "R CMD INSTALL --no-multiarch --preclean r"
# Rd pages only: NAMESPACE stays hand-written.
r-doc = "Rscript -e 'roxygen2::roxygenise(\"r\", roclets = \"rd\")'"
r-test = { cmd = "Rscript -e 'testthat::test_local(\"r\", stop_on_failure = TRUE)'", depends-on = ["r-install"] }

[environments]
r = { features = ["r"], no-default-feature = false }
