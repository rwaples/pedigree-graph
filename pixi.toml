# pedigree-graph development environment (simACE family ADR 0018): a
# self-contained locked env installing this repo editable with its test +
# typecheck extras. ty resolves the package as first-party source here, so no
# compat-mode editable tricks are needed. Consumers install the PyPI wheel.
[workspace]
name = "pedigree-graph"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = "3.13.*"
pip = "*"
rust = ">=1.85"
maturin = ">=1.15.0,<2"

[pypi-dependencies]
pedigree-graph = { path = ".", editable = true, extras = ["test", "typecheck"] }

[tasks]
# Two tiers. `test` is the inner loop and matches CI's push job: everything but
# the 10 `slow` tests (3155 tests after the 2026-09-24 trim). `test-all` is the
# full suite, run before a commit and by the consumer gate (3165 tests), the
# difference being the random_30k gates, each 9-18 s since the v0.7.1 parity
# gate (about 80 s) was retired. -n 6 --dist worksteal: xdist dispatches in collection
# order and the long random_30k tests are collected late, so worksteal is what
# keeps a single one from holding the whole run. No thread pins: the package
# defaults to a one-thread budget (_threads.py). Bare `pixi run pytest` stays
# serial, which is what -v, -s and --pdb need since xdist captures output.
# `build-dev` rebuilds the editable extension with the `test-hooks` feature, and
# PEDIGREE_GRAPH_REQUIRE_TEST_HOOKS=1 makes the panic-boundary test fail, not
# skip, when the hook is missing.  Only installed-wheel runs may skip it.
build-dev = "maturin develop --release --features test-hooks"
test = { cmd = "pytest -n 6 --dist worksteal -m 'not slow'", depends-on = ["build-dev"], env = { PEDIGREE_GRAPH_REQUIRE_TEST_HOOKS = "1" } }
test-all = { cmd = "pytest -n 6 --dist worksteal", depends-on = ["build-dev"], env = { PEDIGREE_GRAPH_REQUIRE_TEST_HOOKS = "1" } }
test-rust = "cargo test --release"

# The R package under r/ (slice 16, plans/pedigree-graph-slice-16-r-package.md
# in simACE). Its own environment so the default one never pulls in R; it
# reuses the Rust pin above. `r-install` builds r/ in place into the env's
# library; `r-test` runs its testthat suite against that install.
[feature.r.dependencies]
r-base = "4.5.*"
r-testthat = ">=3.2"
r-matrix = "*"
r-roxygen2 = "*"
c-compiler = "*"
make = "*"

[feature.r.tasks]
# The dev install carries the `test-hooks` feature (the panic-boundary probe);
# tools/r_build_tarball.sh builds the published tarball without it.
r-install = { cmd = "R CMD INSTALL --no-multiarch --preclean r", env = { PG_CARGO_FEATURES = "test-hooks" } }
# Rd pages only: NAMESPACE stays hand-written.
r-doc = "Rscript -e 'roxygen2::roxygenise(\"r\", roclets = \"rd\")'"
r-test = { cmd = "Rscript -e 'testthat::test_local(\"r\", stop_on_failure = TRUE)'", depends-on = ["r-install"], env = { PEDIGREE_GRAPH_REQUIRE_TEST_HOOKS = "1" } }

[environments]
r = { features = ["r"], no-default-feature = false }
